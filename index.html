<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz - Climas da Europa</title>

<style>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background: #cdbdff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #222;
}

.container {
    width: 95%;
    max-width: 1100px;
    min-height: 650px;
    background: rgba(255,255,255,0.35);
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(50,30,100,0.18);
}


/* =====================================================
   TELA INICIAL
===================================================== */

#inicio {
    min-height: 580px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#inicio h1 {
    font-size: 46px;
    margin-bottom: 15px;
}

#inicio p {
    font-size: 19px;
    color: #554c68;
    line-height: 1.6;
    margin-bottom: 35px;
}

.botao {
    border: none;
    background: white;
    color: #6248b8;
    padding: 17px 50px;
    font-size: 19px;
    font-weight: bold;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 7px 20px rgba(0,0,0,0.12);
    transition: 0.2s;
}

.botao:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.17);
}


/* =====================================================
   QUIZ
===================================================== */

#quiz {
    display: none;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.fase {
    background: white;
    padding: 9px 17px;
    border-radius: 20px;
    color: #6248b8;
    font-weight: bold;
}

.progresso {
    color: #514565;
    font-weight: bold;
}

h2 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 20px;
}


/* =====================================================
   CLIMOGRAMA
===================================================== */

.grafico-container {
    background: white;
    border-radius: 18px;
    padding: 22px 25px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

.grafico-titulo {
    text-align: center;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 20px;
}

.grafico-area {
    position: relative;
    height: 320px;
    margin-left: 65px;
    margin-right: 65px;
}


/* ESCALA DA CHUVA */

.eixo-chuva {
    position: absolute;
    left: -45px;
    top: 0;
    bottom: 25px;
    width: 40px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    text-align: right;

    font-size: 11px;
    color: #666;
}


/* ESCALA DA TEMPERATURA */

.eixo-temp {
    position: absolute;
    right: -45px;
    top: 0;
    bottom: 25px;
    width: 40px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    font-size: 11px;
    color: #d74747;
}


/* ÁREA PRINCIPAL */

.grafico {
    position: absolute;

    left: 0;
    right: 0;

    top: 0;
    bottom: 25px;

    border-left: 2px solid #555;
    border-bottom: 2px solid #555;
}


/* LINHAS DE GRADE */

.grade {
    position: absolute;

    left: 0;
    right: 0;

    border-top: 1px dashed #ddd;
}


/* BARRAS */

.barras {
    position: absolute;

    inset: 0;

    display: flex;
    justify-content: space-around;
    align-items: flex-end;

    padding: 0 5px;
}

.mes {
    position: relative;

    height: 100%;
    width: 7%;
}

.barra {
    position: absolute;

    bottom: 0;
    left: 20%;

    width: 60%;

    background: #8b6edb;

    border-radius: 4px 4px 0 0;
}


/* PONTOS DA TEMPERATURA */

.ponto-temp {
    position: absolute;

    width: 9px;
    height: 9px;

    background: #e44b4b;

    border-radius: 50%;

    transform: translate(-50%, 50%);

    z-index: 5;
}


/* LINHA DA TEMPERATURA */

.linha-temp {
    position: absolute;

    height: 2px;

    background: #e44b4b;

    transform-origin: left center;

    z-index: 4;
}


/* NOMES DOS MESES */

.mes-nome {
    position: absolute;

    bottom: -24px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 11px;

    color: #555;
}


/* LEGENDA */

.legenda {
    display: flex;
    justify-content: center;

    gap: 25px;

    margin-top: 12px;

    font-size: 13px;
}

.legenda-item {
    display: flex;
    align-items: center;

    gap: 7px;
}

.cor-chuva {
    width: 14px;
    height: 14px;

    background: #8b6edb;

    border-radius: 3px;
}

.cor-temp {
    width: 14px;
    height: 14px;

    background: #e44b4b;

    border-radius: 50%;
}


/* =====================================================
   OPÇÕES
===================================================== */

.opcoes {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;
}

.opcao {
    border: 2px solid transparent;

    background: white;

    padding: 15px;

    border-radius: 12px;

    font-size: 16px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;
}

.opcao:hover {
    border-color: #7659c9;

    transform: translateY(-2px);
}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem {
    position: fixed;

    inset: 0;

    background: rgba(30,20,50,0.55);

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 50;
}

.caixa-mensagem {
    background: white;

    width: 90%;
    max-width: 500px;

    padding: 35px;

    border-radius: 22px;

    text-align: center;

    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
}

.caixa-mensagem h3 {
    font-size: 28px;

    margin-bottom: 12px;
}

.caixa-mensagem p {
    font-size: 17px;

    color: #555;

    line-height: 1.5;

    margin-bottom: 25px;
}

.btn-mensagem {
    border: none;

    background: #7356c7;

    color: white;

    padding: 13px 30px;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   TELA FINAL
===================================================== */

#vitoria {
    min-height: 580px;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}

#vitoria h1 {
    font-size: 46px;

    margin-bottom: 15px;
}

#resultadoPontuacao {
    font-size: 20px;

    line-height: 1.6;

    margin-bottom: 20px;
}


/* LISTA DOS RESULTADOS */

#listaResultados {
    width: 100%;

    max-width: 650px;

    margin-bottom: 25px;
}

.resultado-item {
    background: white;

    border-radius: 10px;

    padding: 12px 16px;

    margin: 7px 0;

    text-align: left;

    box-shadow: 0 3px 8px rgba(0,0,0,0.06);
}

.resultado-acerto {
    border-left: 5px solid #43b86b;
}

.resultado-erro {
    border-left: 5px solid #e04b4b;
}

.resultado-acerto strong {
    color: #2e9b54;
}

.resultado-erro strong {
    color: #d83c3c;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:750px) {

    .container {
        padding: 20px;
    }

    .opcoes {
        grid-template-columns: repeat(2,1fr);
    }

    #inicio h1,
    #vitoria h1 {
        font-size: 34px;
    }

    h2 {
        font-size: 23px;
    }

    .grafico-area {
        margin-left: 45px;
        margin-right: 45px;
    }
}

</style>
</head>


<body>


<div class="container">


<!-- =================================================
     TELA INICIAL
================================================== -->

<div id="inicio">

    <h1>🌍 Climas da Europa</h1>

    <p>
        Observe o climograma e descubra qual é o clima.
        <br>
        Você precisa responder às 6 questões.
    </p>

    <button class="botao" onclick="comecarQuiz()">
        COMEÇAR QUIZ
    </button>

</div>


<!-- =================================================
     QUIZ
================================================== -->

<div id="quiz">


    <div class="topo">

        <div class="fase" id="faseTexto">
            Fase 1 de 6
        </div>

        <div class="progresso" id="progresso">
            0 / 6
        </div>

    </div>


    <h2>
        Qual é o clima deste climograma?
    </h2>


    <!-- CLIMOGRAMA -->

    <div class="grafico-container">

        <div class="grafico-titulo">
            Temperatura (°C) e precipitação (mm)
        </div>


        <div class="grafico-area">


            <!-- ESCALA DA CHUVA -->

            <div class="eixo-chuva">

                <span>100</span>

                <span>75</span>

                <span>50</span>

                <span>25</span>

                <span>0</span>

            </div>


            <!-- ESCALA DA TEMPERATURA -->

            <div class="eixo-temp">

                <span>30°</span>

                <span>20°</span>

                <span>10°</span>

                <span>0°</span>

                <span>-10°</span>

                <span>-20°</span>

            </div>


            <div class="grafico" id="grafico">


                <div
                    class="grade"
                    style="top:0%;">
                </div>


                <div
                    class="grade"
                    style="top:25%;">
                </div>


                <div
                    class="grade"
                    style="top:50%;">
                </div>


                <div
                    class="grade"
                    style="top:75%;">
                </div>


                <div
                    class="grade"
                    style="top:100%;">
                </div>


                <div
                    class="barras"
                    id="barras">
                </div>


            </div>

        </div>


        <!-- LEGENDA -->

        <div class="legenda">


            <div class="legenda-item">

                <div class="cor-chuva"></div>

                Precipitação

            </div>


            <div class="legenda-item">

                <div class="cor-temp"></div>

                Temperatura

            </div>


        </div>

    </div>


    <!-- OPÇÕES -->

    <div
        class="opcoes"
        id="opcoes">
    </div>


</div>


<!-- =================================================
     RESULTADO FINAL
================================================== -->

<div id="vitoria">

    <h1>🏆 Resultado Final</h1>


    <p id="resultadoPontuacao"></p>


    <div id="listaResultados"></div>


    <button
        class="botao"
        onclick="reiniciarTudo()">

        JOGAR NOVAMENTE

    </button>

</div>


</div>


<!-- =================================================
     POPUP DE RESPOSTA
================================================== -->

<div
    class="mensagem"
    id="mensagem">


    <div class="caixa-mensagem">


        <h3 id="tituloMensagem"></h3>


        <p id="textoMensagem"></p>


        <button
            class="btn-mensagem"
            onclick="fecharMensagem()">

            CONTINUAR

        </button>


    </div>

</div>


<script>

/* =====================================================
   DADOS DOS CLIMAS
===================================================== */

/*
   TEMPERATURA:
   -20°C até 30°C

   CHUVA:
   0 até 100 mm
*/


const climas = [

    /* ==========================
       TEMPERADO
    ========================== */

    {
        nome: "Temperado",

        temperatura: [
            3, 4, 7, 11,
            15, 18, 20, 19,
            16, 12, 7, 4
        ],

        chuva: [
            68, 62, 65, 70,
            73, 70, 68, 72,
            75, 78, 74, 70
        ]
    },


    /* ==========================
       MEDITERRÂNEO
    ========================== */

    {
        nome: "Mediterrâneo",

        temperatura: [
            9, 10, 12, 15,
            19, 23, 26, 26,
            22, 17, 12, 10
        ],

        chuva: [
            88, 75, 62, 45,
            27, 15, 7, 9,
            20, 48, 72, 90
        ]
    },


    /* ==========================
       POLAR
    ========================== */

    {
        nome: "Polar",

        temperatura: [
            -20, -19, -16, -11,
            -5, 0, 3, 2,
            -2, -8, -14, -18
        ],

        chuva: [
            12, 10, 13, 15,
            18, 20, 22, 21,
            18, 15, 12, 10
        ]
    },


    /* ==========================
       FRIO
    ========================== */

    {
        nome: "Frio",

        temperatura: [
            -8, -7, -3, 3,
            9, 14, 17, 16,
            11, 5, -1, -6
        ],

        chuva: [
            45, 40, 48, 55,
            62, 70, 75, 70,
            60, 55, 48, 42
        ]
    },


    /* ==========================
       FRIO DE MONTANHA
    ========================== */

    {
        nome: "Frio de montanha",

        temperatura: [
            -5, -4, -2, 2,
            6, 9, 11, 10,
            7, 3, -1, -4
        ],

        chuva: [
            65, 60, 68, 72,
            78, 82, 88, 84,
            76, 70, 66, 62
        ]
    },


    /* ==========================
       SEMIÁRIDO
    ========================== */

    {
        nome: "Semiárido",

        temperatura: [
            6, 8, 11, 15,
            19, 23, 26, 25,
            21, 16, 11, 7
        ],

        chuva: [
            22, 18, 20, 17,
            14, 10, 7, 8,
            12, 16, 20, 23
        ]
    }

];


/* =====================================================
   VARIÁVEIS
===================================================== */

let faseAtual = 0;

let acertos = 0;

let ordemClimas = [];

let resultados = [];


const meses = [
    "Jan", "Fev", "Mar",
    "Abr", "Mai", "Jun",
    "Jul", "Ago", "Set",
    "Out", "Nov", "Dez"
];


/* =====================================================
   COMEÇAR QUIZ
===================================================== */

function comecarQuiz() {

    faseAtual = 0;

    acertos = 0;

    resultados = [];


    /*
       Embaralha os 6 climogramas.

       Cada clima aparece apenas uma vez
       durante a partida.
    */

    ordemClimas =
        [...climas].sort(
            () => Math.random() - 0.5
        );


    document.getElementById("inicio")
        .style.display = "none";


    document.getElementById("vitoria")
        .style.display = "none";


    document.getElementById("quiz")
        .style.display = "block";


    carregarQuestao();
}


/* =====================================================
   CARREGAR QUESTÃO
===================================================== */

function carregarQuestao() {

    const clima =
        ordemClimas[faseAtual];


    document.getElementById("faseTexto")
        .textContent =
        `Fase ${faseAtual + 1} de 6`;


    document.getElementById("progresso")
        .textContent =
        `${faseAtual} / 6`;


    criarGrafico(clima);

    criarOpcoes();
}


/* =====================================================
   CRIAR CLIMOGRAMA
===================================================== */

function criarGrafico(clima) {

    const barras =
        document.getElementById("barras");


    barras.innerHTML = "";


    /*
       Cria as 12 barras e os
       12 pontos de temperatura.
    */

    for(let i = 0; i < 12; i++) {


        const mes =
            document.createElement("div");

        mes.className = "mes";


        /* BARRA DE CHUVA */

        const barra =
            document.createElement("div");

        barra.className = "barra";


        /*
           100 mm = 100% da altura.
        */

        barra.style.height =
            clima.chuva[i] + "%";


        /* PONTO DA TEMPERATURA */

        const ponto =
            document.createElement("div");

        ponto.className =
            "ponto-temp";


        /*
           Escala:

           -20°C = 0%
           30°C = 100%
        */

        let posicao =
            ((clima.temperatura[i] + 20) / 50) * 100;


        posicao =
            Math.max(
                0,
                Math.min(100, posicao)
            );


        ponto.style.bottom =
            posicao + "%";


        /* MÊS */

        const nomeMes =
            document.createElement("div");

        nomeMes.className =
            "mes-nome";


        nomeMes.textContent =
            meses[i];


        mes.appendChild(barra);

        mes.appendChild(ponto);

        mes.appendChild(nomeMes);


        barras.appendChild(mes);
    }


    /*
       Desenha a linha da temperatura.
    */

    setTimeout(() => {


        const grafico =
            document.getElementById("grafico");


        grafico
            .querySelectorAll(".linha-temp")
            .forEach(linha =>
                linha.remove()
            );


        const pontos =
            grafico
                .querySelectorAll(
                    ".ponto-temp"
                );


        for(let i = 0;
            i < pontos.length - 1;
            i++) {


            const p1 =
                pontos[i];


            const p2 =
                pontos[i + 1];


            const x1 =
                p1.offsetLeft +
                p1.offsetWidth / 2;


            const y1 =
                p1.offsetTop +
                p1.offsetHeight / 2;


            const x2 =
                p2.offsetLeft +
                p2.offsetWidth / 2;


            const y2 =
                p2.offsetTop +
                p2.offsetHeight / 2;


            const distancia =
                Math.sqrt(
                    Math.pow(
                        x2 - x1,
                        2
                    )
                    +
                    Math.pow(
                        y2 - y1,
                        2
                    )
                );


            const angulo =
                Math.atan2(
                    y2 - y1,
                    x2 - x1
                )
                * 180 / Math.PI;


            const linha =
                document.createElement("div");


            linha.className =
                "linha-temp";


            linha.style.width =
                distancia + "px";


            linha.style.left =
                x1 + "px";


            linha.style.top =
                y1 + "px";


            linha.style.transform =
                `rotate(${angulo}deg)`;


            grafico.appendChild(linha);
        }

    }, 30);
}


/* =====================================================
   CRIAR OPÇÕES
===================================================== */

function criarOpcoes() {

    const div =
        document.getElementById("opcoes");


    div.innerHTML = "";


    const correto =
        ordemClimas[faseAtual].nome;


    /*
       Quantidade de opções:

       Fase 1 = 6
       Fase 2 = 5
       Fase 3 = 4
       Fase 4 = 3
       Fase 5 = 2
       Fase 6 = 2
    */

    let quantidade =
        Math.max(
            2,
            6 - faseAtual
        );


    let opcoes = [correto];


    const erradas =
        climas
            .filter(
                clima =>
                    clima.nome !== correto
            )
            .sort(
                () =>
                    Math.random() - 0.5
            );


    for(const clima of erradas) {


        if(
            opcoes.length >=
            quantidade
        ) {
            break;
        }


        opcoes.push(
            clima.nome
        );
    }


    /*
       Embaralha as respostas.
    */

    opcoes.sort(
        () => Math.random() - 0.5
    );


    /*
       Cria os botões.
    */

    opcoes.forEach(nome => {


        const botao =
            document.createElement("button");


        botao.className =
            "opcao";


        botao.textContent =
            nome;


        botao.onclick =
            () =>
                verificarResposta(
                    nome
                );


        div.appendChild(
            botao
        );

    });
}


/* =====================================================
   VERIFICAR RESPOSTA
===================================================== */

function verificarResposta(resposta) {

    const correto =
        ordemClimas[faseAtual].nome;


    const acertou =
        resposta === correto;


    /*
       Salva o resultado.
    */

    resultados.push({

        fase:
            faseAtual + 1,

        clima:
            correto,

        resposta:
            resposta,

        acertou:
            acertou

    });


    /* ==========================
       ACERTOU
    ========================== */

    if(acertou) {

        acertos++;


        /*
           AVANÇA PARA A PRÓXIMA FASE
        */

        faseAtual++;


        /*
           Se terminou:
        */

        if(faseAtual >= 6) {

            mostrarResultadoFinal();

            return;
        }


        mostrarMensagem(

            "✅ Você acertou!",

            `Muito bem!

O clima era ${correto}.

Você prosseguiu para a próxima fase.`

        );

    }


    /* ==========================
       ERROU
    ========================== */

    else {


        /*
           NÃO REINICIA.

           Apenas passa para a próxima fase.
        */

        faseAtual++;


        /*
           Se terminou:
        */

        if(faseAtual >= 6) {

            mostrarResultadoFinal();

            return;
        }


        mostrarMensagem(

            "❌ Você errou!",

            `A resposta correta era ${correto}.

Sua resposta foi: ${resposta}.

Você continuará para a próxima fase.`

        );

    }

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    titulo,
    texto
) {


    document.getElementById(
        "tituloMensagem"
    ).textContent =
        titulo;


    document.getElementById(
        "textoMensagem"
    ).textContent =
        texto;


    document.getElementById(
        "mensagem"
    ).style.display =
        "flex";

}


/* =====================================================
   FECHAR MENSAGEM
===================================================== */

function fecharMensagem() {


    document.getElementById(
        "mensagem"
    ).style.display =
        "none";


    carregarQuestao();

}


/* =====================================================
   RESULTADO FINAL
===================================================== */

function mostrarResultadoFinal() {


    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "vitoria"
    ).style.display =
        "flex";


    /*
       Pontuação
    */

    document.getElementById(
        "resultadoPontuacao"
    ).innerHTML =

        `Você acertou <strong>${acertos}</strong> de <strong>6</strong> questões.`;


    /*
       Lista
    */

    const lista =
        document.getElementById(
            "listaResultados"
        );


    lista.innerHTML = "";


    resultados.forEach(
        resultado => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "resultado-item";


            /* ACERTO */

            if(resultado.acertou) {


                item.classList.add(
                    "resultado-acerto"
                );


                item.innerHTML = `

                    <strong>
                        Fase ${resultado.fase} — ✅ Acertou
                    </strong>

                    <br>

                    Clima:
                    <strong>
                        ${resultado.clima}
                    </strong>

                `;

            }


            /* ERRO */

            else {


                item.classList.add(
                    "resultado-erro"
                );


                item.innerHTML = `

                    <strong>
                        Fase ${resultado.fase} — ❌ Errou
                    </strong>

                    <br>

                    Sua resposta:
                    ${resultado.resposta}

                    <br>

                    Resposta correta:
                    <strong>
                        ${resultado.clima}
                    </strong>

                `;

            }


            lista.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   JOGAR NOVAMENTE
===================================================== */

function reiniciarTudo() {


    document.getElementById(
        "vitoria"
    ).style.display =
        "none";


    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "inicio"
    ).style.display =
        "flex";

}

</script>
